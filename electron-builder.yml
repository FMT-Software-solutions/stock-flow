appId: com.fmtsoftware.stock-flow
productName: StockFlow
copyright: Copyright © 2025 FMT Software Solutions

artifactName: stock-flow-setup-${version}.${ext}
directories:
  output: release/build
# No `electronDist: node_modules/electron/dist` here (print-calc-pro uses it to
# dodge the win-unpacked.tmp EPERM): with electron-builder 26 it makes the
# build exit 1 silently before extraResources are copied. The release script
# retries EPERM instead.
files:
  - dist/**/*
  - electron-app/dist/**/*
  - package.json
  # The renderer is fully bundled by Vite into dist/, so the packaged app only
  # needs the modules the main process require()s at runtime. Shipping every
  # production dependency again roughly doubled the installer for nothing.
  - '!node_modules/**/*'
  - node_modules/dotenv/**/*
extraResources:
  - from: release/assets
    to: assets
    filter:
      - '**/*'
  - from: 'config/config.json'
    to: 'config.json'
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: release/assets/favicon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StockFlow
  installerIcon: release/assets/favicon.ico
  uninstallerIcon: release/assets/favicon.ico
  installerHeaderIcon: release/assets/favicon.ico
  installerSidebar: release/assets/fmt-sidebar-banner.bmp
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  menuCategory: Finance
  displayLanguageSelector: false
  installerLanguages:
    - en_US
  license: false
  warningsAsErrors: false
mac:
  target: dmg
  icon: release/assets/icon.png
  category: public.app-category.business
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Finance
  icon: release/assets/icons

appImage:
  artifactName: '${productName}-${version}.AppImage'

publish:
  provider: generic
  url: https://your-domain.com/releases/

forceCodeSigning: false
